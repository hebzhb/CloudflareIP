name: JP

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run script and save output
        run: |
          python py/JP.py > JP.txt

      - name: Commit result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp JP.txt /tmp/result.txt
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin
            git reset --hard origin/main
            cp /tmp/result.txt JP.txt
            git add JP.txt
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -m "Auto update JP.txt [skip ci]"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
