name: SG

on:
  push:              # 每次 push 时触发
  schedule:
   - cron: '0 */1 * * *' # 每3小时运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run script and save output
        run: |
          python py/SG.py > SG.txt

      - name: Commit result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SG.txt
          git commit -m "Auto update SG.txt [skip ci]" || echo "No changes to commit"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
